<!DOCTYPE html>
<html>
<head>
  <title>ELARA</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 10px; }
    input { width: 70%; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h2>ELARA</h2>
  <div id="chat"></div>
  <input id="input" type="text" placeholder="Ask me something...">
  <button onclick="handleChat()">Send</button>

  <script>
    let pyodide;

    async function main() {
      pyodide = await loadPyodide();
      const response = await fetch("chatbot.py");
      const pyCode = await response.text();
      await pyodide.runPythonAsync(pyCode);
      console.log("Pyodide and chatbot.py loaded");
    }

    function extractWikiTopic(text) {
      text = text.toLowerCase().trim();
      const patterns = [
        /^who is /, /^what is /, /^tell me about /, /^do you know /,
        /^explain /, /^define /, /^give me information about /,
        /^can you tell me about /, /^can you explain /, /^can you define /, /^who was /, /^tell me about the /
      ];
      for (const pattern of patterns) {
        text = text.replace(pattern, "");
      }
      return text;
    }

    async function handleChat() {
      const inputBox = document.getElementById("input");
      const query = inputBox.value.trim();
      if (!query) return;

      inputBox.value = "";
      addMessage("You", query);

      const pythonCode = `answer(${JSON.stringify(query)})`;
      let pyAnswer = await pyodide.runPythonAsync(pythonCode);

      if (pyAnswer === "__wikipedia__") {
        const topic = extractWikiTopic(query);
        const summary = await fetchWiki(topic);
        pyAnswer = summary || "I couldn't find anything on Wikipedia.";
      }

      addMessage("ELARA", pyAnswer);
    }

    function addMessage(sender, message) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.innerHTML = `<strong>${sender}:</strong> ${message}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showDisambiguationOptions(title, options) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.innerHTML = `<strong>Select what you meant by "${title}":</strong><br>`;

      options.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = async () => {
          addMessage("You", option);
          const summary = await fetchWiki(option, true);
          addMessage("ELARA", summary);
        };
        btn.style.margin = "4px";
        div.appendChild(btn);
      });

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function fetchWiki(title, direct = false) {
      const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&titles=${encodeURIComponent(title)}&prop=extracts|pageprops&exintro=1&explaintext=1&redirects=1`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query.pages;
        const page = Object.values(pages)[0];

        if (page.pageprops && page.pageprops.disambiguation && !direct) {
          const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srsearch=${encodeURIComponent(title)}`;
          const searchRes = await fetch(searchUrl);
          const searchData = await searchRes.json();
          const options = searchData.query.search.map(entry => entry.title);
          showDisambiguationOptions(title, options);
          return `Hmm, "${title}" could refer to multiple things. Please select one:`;
        }

        return page.extract || "No summary available.";
      } catch (error) {
        console.error("Wikipedia fetch error:", error);
        return "Sorry, I couldn't fetch that information.";
      }
    }

    main();
  </script>
</body>
</html>
