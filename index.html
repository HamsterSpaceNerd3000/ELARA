<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELARA</title>
  <link rel="icon" type="image/x-icon" href="/ELARA Icon.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
  <style>
    body { font-family: 'Orbitron', sans-serif; padding: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 10px; }
    input { width: 70%; }
    #loadingScreen { 
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center;
      align-items: center; font-size: 24px; color: white; z-index: 999;
    }
  </style>
</head>
<body>
  <div id="loadingScreen">Waking ELARA...</div>
  <h2>ELARA V1.5</h2>
  <div id="chat"></div>
  <input id="input" type="text" placeholder="Ask me something..." onkeydown="checkEnter(event)">
  <button onclick="handleChat()">Send</button>

  <script>
    let pyodide;

    async function main() {
      console.log("Loading Pyodide...");
      pyodide = await loadPyodide();
      const response = await fetch("chatbot.py");
      const pyCode = await response.text();
      await pyodide.runPythonAsync(pyCode);
      document.getElementById("loadingScreen").style.display = "none"; // Hide the loading screen
      console.log("Pyodide and chatbot.py loaded successfully");
      addMessage("ELARA", "Hello! I'm ELARA, your AI assistant. How can I help you today?");
    }

    async function handleChat() {
      const inputBox = document.getElementById("input");
      let query = inputBox.value.trim();
      inputBox.value = "";

      addMessage("You", query);
      console.log("User asked:", query);

      query = query.replace(/[.,\/#!$%\^&\*\;:{}=_`~()?"']/g, "").trim();

      const pythonCode = `answer(${JSON.stringify(query)})`;
      let pyAnswer = await pyodide.runPythonAsync(pythonCode);
      console.log("Python returned:", pyAnswer);

      if (pyAnswer === "__wikipedia__") {
        const topic = extractWikiTopic(query);
        console.log("Fallback to Wikipedia for topic:", topic);
        const summary = await fetchWiki(topic);
        if (summary !== "__disambiguation__") {
          addMessage("ELARA", summary);
        }
        return;
      }

      if (pyAnswer === "__restart__") {
        console.log("Restarting ELARA...");
        resetChat();
        await main();  // Reinitialize Pyodide
        addMessage("ELARA", "ELARA has been restarted.");
        return;
      }

      if (pyAnswer === "__clear__") {
        console.log("Clearing chat...");
        clearChat();
        return;
      }

      addMessage("ELARA", pyAnswer);
    }

    function resetChat() {
        window.location.reload();
    }

    function clearChat() {
        const chatBox = document.getElementById("chat"); // Assuming chat is the container for chat messages
        chatBox.innerHTML = ""; // Clear all chat messages
        console.log("Chat cleared.");
        addMessage("ELARA", "Hello! I'm ELARA, your AI assistant. How can I help you today?");
    }

    function checkEnter(event) {
      if (event.key === "Enter") {
        handleChat();
      }
    }

    function extractWikiTopic(text) {
      text = text.toLowerCase().trim();
      const patterns = [
        /^who is /, /^what is /, /^tell me about /, /^do you know /,
        /^explain /, /^define /, /^give me information about /,
        /^can you tell me about /, /^can you explain /, /^can you define /,
        /^who was /, /^what are/, /^the /
      ];
      for (const pattern of patterns) {
        text = text.replace(pattern, "");
      }
      return text.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
    }

    async function fetchWiki(title, direct = false) {
      console.log("Fetching summary for:", title);
      const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&titles=${encodeURIComponent(title)}&prop=extracts|pageprops&exintro=1&explaintext=1&redirects=1`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query.pages;
        const page = Object.values(pages)[0];

        if (page.pageprops && page.pageprops.disambiguation && !direct) {
          const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srsearch=${encodeURIComponent(title)}`;
          const searchRes = await fetch(searchUrl);
          const searchData = await searchRes.json();
          const options = searchData.query.search.map(entry => entry.title);
          showDisambiguationOptions(title, options);
          return "__disambiguation__";
        }

        return page.extract || "Sorry I didn't understand. Can you try rewording it?";
      } catch (error) {
        console.error("Wikipedia fetch error:", error);
        return "Sorry, I couldn't fetch that information.";
      }
    }

    function showDisambiguationOptions(title, options) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.innerHTML = `<strong>Options for "${title}":</strong><br>`;

      options.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = async () => {
          addMessage("You", option);
          const summary = await fetchWiki(option, true);
          addMessage("ELARA", summary);
        };
        div.appendChild(btn);
      });

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(sender, message) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      if (sender === "ELARA") {
        const typingSpan = document.createElement("span");
        typingSpan.className = "typing";
        const cursorSpan = document.createElement("span");
        cursorSpan.className = "cursor";
        cursorSpan.textContent = "|";

        div.innerHTML = `<strong>${sender}:</strong> `;
        div.appendChild(typingSpan);
        div.appendChild(cursorSpan);

        let i = 0;
        function type() {
          if (i < message.length) {
            typingSpan.innerHTML += message[i] === '\n' ? "<br>" : message[i];
            i++;
            chat.scrollTop = chat.scrollHeight;
            setTimeout(type, 5);
          } else {
            cursorSpan.remove(); // Properly remove the cursor once done
          }
        }

        type();
      } else {
        div.innerHTML = `<strong>${sender}:</strong> ${message.replace(/\n/g, "<br>")}`;
      }
    }

    function closeModal() {
      document.getElementById("helpModal").style.display = "none";
    }

    window.onload = () => {
      document.getElementById("helpModal").style.display = "flex";
      main(); // Don't forget to still start ELARA
    };

        
  </script>

</body>
<div id="helpModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>Welcome to ELARA V1.5!</h3>
    <p>You can ask ELARA questions like:</p>
    <ul>
      <li>“What's the capital of France?”</li>
      <li>“Who is Albert Einstein?”</li>
      <li>“Tell me about George Washington”</li>
      <li>“Clear” or “Restart” to refresh the chat</li>
    </ul>
    <p>Type your question below and press Enter or click Send.</p>
  </div>
</div>

</html>
